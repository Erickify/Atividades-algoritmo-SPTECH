<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeros-Aleatorios</title>

<style>


</style>

<body>

    <h1>Numeros aleatório</h1>

    <button onclick="aleatorizar()">Sortear Nota para aluno</button>

    <button onclick="ver()">Ver situação do aluno</button>

    <!-- <input type="text" name="" id="inp_1" placeholder="ex:32"> -->

    <div id="div_msg">
        <p id="p_msg"></p>
    </div>


</body>

</html>

<script>

    var frequencias = freq

    var notas = nota


    function aleatorizar() {

        var min = 0
        var max = 10
        var inter = max - min

        var msg = ``

        if (max >= min) {

           
            var nota = (Math.random() * inter /* intervalo */ + min /* minimo */).toFixed(2)

            
            
            var freq = (Math.random() * (inter * 10) /* intervalo */ + min /* minimo */).toFixed(2)
            
            // if(freq == 100 || freq == 0 ){
            //     console.log(nota+' '+freq)
            //     alert(`nota = ${nota}\n freq = ${freq}`)
            // }

            msg += `<h1> ${nota} </h1>`
            msg += `<h1> ${freq} </h1>` 


        } else {

            alert(`Intervalo invalido`)

        }

        p_msg.innerHTML = msg

    }
        function ver(){

            alert('nota = '+notas+'\n frequencia = '+frequencias)

        }

    

</script>
