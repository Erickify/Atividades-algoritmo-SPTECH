<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <center>

        <h1>Timão</h1>

        <br>

        <h2> Selecione o resultado:</h2>

        <select id="slct_res">

            <option>Vitória</option>

            <option>Empate</option>

            <option>Derrota</option>

        </select><br><br>

        <button onclick="resultado()">Registrar jogo</button><br>

        <br>

        Indique qual jogo deseja saber o resultado:

        <input type="text" id="input_pesquisar" oninput="selecionar()"><br>

        <div id="msg"></div>
    </center>
</body>

</html>
<script>

    var lista = []

    function resultado() {
        
        var vitorias = 0
        
        var empates = 0

        var derrotas = 0
        
        var resultado = slct_res.value
        
        lista.push(resultado)


        for (var i = lista.length; i > 0; i--) {
            
            if (lista[i - 1] == 'Vitória') {
            
                vitorias += 1
            
            } else if (lista[i - 1] == 'Empate') {
            
                empates += 1
            
            } else {
            
                derrotas += 1
            
            }
            
            var pontos = vitorias * 3 + empates * 1 + 
            derrotas * 0
            
            var Aproveitamento = (pontos / (lista.length * 3)) * 100
            
            msg.innerHTML = `
            O time teve: ${vitorias} vitórias, ${empates} empates, ${derrotas} derrotas<br>  
            Pontuação total: ${pontos} pontos<br>  
            Aproveitamento: ${Aproveitamento}%
        `
        }
    }

    function selecionar() {
        
        var pesquisar = Number(input_pesquisar.value)
        
        if (pesquisar == ``) {


        } else if (pesquisar <= lista.length) {
        
            msg.innerHTML = `No ${pesquisar} jogo, o time ${lista[pesquisar - 1]}`
        
        } else {
        
            msg.innerHTML = `Não foi cadastrado um ${pesquisar}º jogo`
        
        }

    }

</script>
