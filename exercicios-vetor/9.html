<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>Lista de Projetos</h1>
        <br>
        <input type="text" id="inpt_itens">
        <br>
        <br>

        <button onclick="Vetor()">Registrar projeto</button>
        <button onclick="mostrarVetor()">Mostrar Projetos</button>

        <div id="div_msg">
            <p id="p_msg">

                Você já fez 0 projetos.


            </p>
        </div>

    </center>

</body>

</html>
<script>



    lista = []

    function Vetor() {

        var produto = inpt_itens.value;

        lista.push(produto)

        if (lista.length > 0 && lista.length <= 4) {

            p_msg.innerHTML = `Você já fez ${lista.length} projetos. Por isso você é um profissional Junior`

        } else if (lista.length <= 12) {

            p_msg.innerHTML = `Você já fez ${lista.length} projetos. Por isso você é um profissional Pleno`

        } else {

            p_msg.innerHTML = `Você já fez ${lista.length} projetos. Por isso você é um profissional Sênior`

        }



    }

    function mostrarVetor() {

        var msg = ''

        for (i = lista.length; i > 0; i--) {

            msg += ` ${lista[i - 1]}<br>`

        }

        p_msg.innerHTML = msg
    }




</script>
