<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>
        
    <h1>Insira uma fruta na sexta</h1>
    <br>
    <input type="text" id="inpt_itens">
    <br>
    <br>

    <button onclick="Vetor()">Cadastrar bairro</button>

    <br>
    <br>

    <input type="text" id="inpt_indice">

    <br>
    <br>

    <button onclick="Vetor2()">Relembrar moradia</button>

    <div id="div_msg">
        <p id="p_msg">

        </p>
    </div>

    </center>

</body>

</html>
<script>


lista = []

var produto = '';


function Vetor() {

    produto = inpt_itens.value;
    lista.push(produto)


}

function Vetor2(){

    indice = inpt_indice.value

    var msg = ''

    if(lista.length + 1 > indice){

        msg = lista[indice - 1]

    }else{

        msg = `Você ainda não morou num ${indice}º bairro!`

    }

    p_msg.innerHTML = msg


}
       









</script>
