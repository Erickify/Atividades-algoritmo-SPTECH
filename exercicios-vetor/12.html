<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>Insira preço do Produto</h1>
        <br>
        <input type="text" id="inpt_itens">
        <br>
        <br>

        <button onclick="Vetor()">Cadastrar</button>
        <br>
        <br>
        <button onclick="mostrarVetor()">Pesquisar</button>

        <div id="div_msg">
            <p id="p_msg">


            </p>
        </div>

    </center>

</body>

</html>
<script>

    lista = []

    function Vetor() {

        var produto = Number(inpt_itens.value);

        lista.push(produto)


    }

    function mostrarVetor() {

        var msg = ''

        var produtos = 0

        for (i = lista.length - 1; i >= 0; i--) {

            msg += ` ${lista[i - 1]}<br>`

            produtos += lista[i]

        }

        p_msg.innerHTML = msg

        p_msg.innerHTML = ` Você tem ${lista.length} produtos cadastrados em estoque<br>Seu estoque vale R$${produtos} `


    }







</script>
