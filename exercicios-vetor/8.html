<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>Lista de Alunos</h1>
        <br>
        <input type="text" id="inpt_itens">
        <br>
        <br>

        <button onclick="Vetor()">Cadastrar</button>

        <div id="div_msg">
            <p id="p_msg">



            </p>
        </div>

    </center>

</body>

</html>
<script>



    lista = []

    function Vetor() {

        var produto = inpt_itens.value;

        var msg = ''

        lista.push(produto)

        for (i = lista.length; i > 0; i--) {

            msg += ` ${lista[i - 1]}<br>`

        }

        p_msg.innerHTML = msg



    }




</script>
