<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>digite o nome do produto</h1>
        <br>
        <input type="text" id="inpt_nome">
        <br>
        <h1>digite o preço do produto</h1>
        <br>
        <input type="text" id="inpt_preco">
        <br>

        <button onclick="cadastar()">Cadastrar Produto</button>

        <button onclick="relatorio()">Relatorio</button>


        <div id="div_msg">
            <p id="p_msg">


            </p>
        </div>

    </center>

</body>

</html>
<script>

    nomes = []

    precos = []

    function cadastar() {

        var nome = inpt_nome.value
        var preco = inpt_preco.value

        nomes.push(nome)
        precos.push(preco)




    }

    function relatorio() {

        
                    var msg = ''
        
                    var msg2 = `
                Total de produtos ${nomes.length}
                
                `

        for (i = 0; i < nomes.length; i++) {



            var preco_compra = precos[i]

            msg += ` produto ${i + 1}: ${nomes[i]}<br>
            Preço de compra: R$${preco_compra}. Vender por R$${preco_compra * 1.25}<br><br>`


        }

        p_msg.innerHTML = `${msg2}<br>${msg}`

    }






</script>
