<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>produto</h1>
    <input type="text" name="" id="inp_1">
    <button onclick="add()">lista</button>

    <p id="p_msg">

    </p>
</body>
</html>
<script>

    lista = []

    function add(){
        var produto = inp_1.value;
        lista.push(produto) 

        msg = `${lista} <br> <br>`

        for (i = 0; i < lista.length; i++ ){

                msg += `${i}. ${lista[i]}<br>`
                alert('foi')
        }

        p_msg.innerHTML = msg


    }

</script>
