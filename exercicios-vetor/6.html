<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>Lista Viva de Filmes Favoritos</h1>
        <br>
        <input type="text" id="inpt_itens">
        <br>
        <br>

        <button onclick="Vetor()">Cadastrar</button>

        <div id="div_msg">
            <p id="p_msg">

            </p>
        </div>

    </center>

</body>

</html>
<script>



    lista = []

    function Vetor() {

        var produto = inpt_itens.value;

        var msg = ''

        lista.push(produto)

        for (i = 0; i < lista.length; i++) {

            msg += ` ${lista[i]}<br>`
       
        }

        p_msg.innerHTML = msg



    }






</script>
