<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>Lista Viva de Filmes Favoritos</h1>
        <br>
        <input type="text" id="inpt_itens">
        <br>
        <br>

        <button onclick="Vetor()">Cadastrar</button>

        <div id="div_msg">
            <p id="p_msg" style="color: blue;">

                <span style="color: blue"></span>

            </p>
        </div>

    </center>

</body>

</html>
<script>



    lista = []

    function Vetor() {

        var produto = inpt_itens.value;

        var msg = ''

        lista.push(produto)

        for (i = 0; i < lista.length; i++) {

            if(!(lista.length % 2 == 0) ){

                msg = `<span style="color: red"> ${lista[i]}<br></span>`

            }else{

                msg = `<span style="color: blue"> ${lista[i]}<br></span>`
            
            }

       
        }

        p_msg.innerHTML += msg



    }




</script>
