<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>Lista de Linhas de Onibus</h1>
        <br>
        <input type="text" id="inpt_linhas">
        <br>
        <br>

        <button onclick="Vetor()">Gravar busão</button>
        <br>
        <br>
        <input type="text" name="" id="inpt_linha_pesquisa">
        <br>
        <br>
        <button onclick="Pesquisar()">Pesquisar</button>

        <div id="div_msg">
            <p id="p_msg">




            </p>
        </div>

    </center>

</body>

</html>
<script>



    lista = []

    function Vetor() {

        var linha = inpt_linhas.value;

        lista.push(linha)

        var msg = ''

        for (i = lista.length - 1; i >= 0; i--) {

            msg += ` ${lista[i]}<br>`

        }

        p_msg.innerHTML = msg
    }

    function Pesquisar() {

        pesquisa = inpt_linha_pesquisa.value

        var msg = ''

        var qtd = 0

        pesquisas = []



        for (var i = 0; lista.length > i; i++) {

            if (lista[i] == pesquisa) {

                pesquisas.push(i + 1)


            }

        }



            p_msg.innerHTML = `Você já pegou essa linha ${pesquisas.length} vezes, nessa ordem: ${pesquisas}`


            if (pesquisas.length == 0) {


                p_msg.innerHTML = `Você nunca pegou essa linha`

            }

        }






</script>
