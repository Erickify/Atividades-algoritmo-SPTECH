<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>

    <center>

        <h1>Cadastrar filme</h1>
        <br>
        <input type="text" id="inpt_itens">
        <br>
        <br>

        <button onclick="Vetor()">Ver Favoritos</button>

        <div id="div_msg">
            <p id="p_msg">

            </p>

            <p id="p_msg2">

            </p>

        </div>

    </center>

</body>

</html>
<script>

    lista = []

     function Vetor(){

        var msg = ''

        var msg2 = ''

        var filme = inpt_itens.value;
        
        lista.push(filme) 


        for (i = 0; i < lista.length; i++ ){

                msg += ` ${lista[i]}<br>`

                 msg2 = `Total: ${lista.length}<br>`

        }

        p_msg.innerHTML = msg
        p_msg2.innerHTML = msg2
        p_msg2.innerHTML += ` O que filme que mais gosta é ${lista[0]}.<br>`
        p_msg2.innerHTML += ` E desses, o que menos gosta é ${lista[lista.length - 1]}.`


    }





</script>
