<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>

<body>
    <center>

        <h1>Insira Sua Idade</h1>
        <input type="text" id="inp_idade">
        <br>
        <br>

        <button onclick="contar()">Contar de 1 a 10</button>

        <br>
        <br>

        <div id="div_msg">

        </div>
    </center>
</body>

</html>

<script>

    function contar() {
        var msg = ""

        var idade = Number(inp_idade.value)


        for (i = 0; i <= idade; i++) {


            if (i <= 4) {

                msg += `${i} anos (Primeira Infância)<br>`

            } else if (i <= 6) {

                msg += `${i} anos (Pré-escolar)<br>`

            } else if (i <= 10) {

                msg += `${i} anos (Segunda Infância)<br>`

            } else if (i <= 18) {

                msg += `${i} anos (Adolescência)<br>`

            } else if (i <= 50) {

                msg += `${i} anos (Adulto)<br>`

            } else if (i <= 100) {

                msg += `${i} anos (Melhor idade)<br>`

            } else {

                msg += `${i} anos (Matusalém)<br>`

            }
            


        }

        div_msg.innerHTML = msg

    }

</script>
