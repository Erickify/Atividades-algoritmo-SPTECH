<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>

<body>
    <center>

        <h1>FizzBuzz</h1>
        <br>
        <br>

        <button onclick="contar()">FizzBuzz</button>

        <br>
        <br>

        <div id="div_msg">

        </div>
    </center>
</body>

</html>

<script>

    function contar() {
        var msg = ""

        for (i = 1; i <= 100; i++) {

            if((i % 3 == 0) && (i % 5 == 0)){

                msg += `Fizzbuzz<br>`



            }else if(i % 5 == 0){

                msg += `Buzz<br>`


            }else if(i % 3 == 0){

                msg += `Fizz<br>`



            }else{
           
                msg += `${i}<br>`

            }




        }

        div_msg.innerHTML = msg

    }

</script>

Regras do FizzBuzz:

Se o número for múltiplo de 3 e 5, exiba "FizzBuzz".
